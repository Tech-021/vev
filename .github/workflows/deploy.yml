name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vev-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ENABLE_DEMO_LOGIN: ${{ secrets.NEXT_PUBLIC_ENABLE_DEMO_LOGIN }}

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Package production release
        run: |
          tar -czf vev-release.tar.gz \
            .next \
            public \
            node_modules \
            package.json \
            package-lock.json \
            next.config.ts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vev-release-${{ github.sha }}
          path: vev-release.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: vev-release-${{ github.sha }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'developer' }}
        run: |
          scp -P "$DEPLOY_PORT" \
            vev-release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/vev-release-${GITHUB_SHA}.tar.gz"

      - name: Activate release and reload PM2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'developer' }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_ROOT=/var/www/vev
          RELEASE_DIR="$APP_ROOT/releases/$RELEASE_SHA"
          ARCHIVE="/tmp/vev-release-$RELEASE_SHA.tar.gz"

          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          ln -sfn "$APP_ROOT/.env.local" "$RELEASE_DIR/.env.local"
          ln -sfnT "$RELEASE_DIR" "$APP_ROOT/current"

          export PM2_HOME=/home/developer/.pm2
          /usr/bin/pm2 reload "$APP_ROOT/ecosystem.config.cjs" --update-env
          /usr/bin/pm2 save

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:3010/ >/dev/null; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "The deployed app did not become healthy" >&2
              exit 1
            fi
            sleep 2
          done

          rm -f "$ARCHIVE"
          find "$APP_ROOT/releases" -mindepth 1 -maxdepth 1 -type d \
            ! -name "$RELEASE_SHA" -printf '%T@ %p\n' \
            | sort -nr | tail -n +6 | cut -d' ' -f2- \
            | xargs -r rm -rf
          REMOTE
